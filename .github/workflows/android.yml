# APK de producción firmado (anexo §4.10: distribución directa desde R2, sin Play Store en el piloto).
name: APK Android
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar en R2 (yvy-tiles/app/yvy.apk)
        type: boolean
        default: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.APP_URL }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - run: pnpm install --frozen-lockfile
      - name: Prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install
      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Firmar con la clave de Yvy
        working-directory: apps/mobile/android/app/build/outputs/apk/release
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > yvy.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 app-release.apk aligned.apk
          "$BT/apksigner" sign --ks yvy.keystore --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out yvy.apk aligned.apk
          "$BT/apksigner" verify --print-certs yvy.apk | head -3
          rm yvy.keystore
          ls -la yvy.apk
      - uses: actions/upload-artifact@v7
        with: { name: yvy-apk, path: apps/mobile/android/app/build/outputs/apk/release/yvy.apk }
      - name: Publicar en R2
        if: ${{ inputs.publish }}
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          APK=../mobile/android/app/build/outputs/apk/release/yvy.apk
          npx wrangler r2 object put yvy-tiles/app/yvy.apk --file "$APK" --content-type application/vnd.android.package-archive --remote
          npx wrangler r2 object put "yvy-tiles/app/yvy-${{ github.run_number }}.apk" --file "$APK" --content-type application/vnd.android.package-archive --remote
