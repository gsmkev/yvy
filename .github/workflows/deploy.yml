# Deploy del Worker (API + web) en cada push a main, después de lint, typecheck y tests.
# Se activa con la variable de repositorio DEPLOY_ENABLED=true (ver docs/DEPLOY.md).
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm --filter web build
        env:
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN_WEB }}
      - name: Configuración de producción
        working-directory: apps/api
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          sed -i "s/\"database_id\": \"[^\"]*\"/\"database_id\": \"$D1_DATABASE_ID\"/" wrangler.jsonc
          grep -q "$D1_DATABASE_ID" wrangler.jsonc
      - name: Migraciones D1
        working-directory: apps/api
        run: npx wrangler d1 migrations apply yvy --remote
      - name: Deploy
        working-directory: apps/api
        env:
          APP_URL: ${{ vars.APP_URL }}
          TILES_PUBLIC_URL: ${{ vars.TILES_PUBLIC_URL }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          ALLOW_SIGNUP: ${{ vars.ALLOW_SIGNUP || 'true' }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          OPS_EMAIL: ${{ vars.OPS_EMAIL }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN_API }}
        run: >
          npx wrangler deploy
          --var "APP_ENV:production"
          --var "APP_URL:$APP_URL"
          --var "TILES_PUBLIC_URL:$TILES_PUBLIC_URL"
          --var "EMAIL_FROM:$EMAIL_FROM"
          --var "ALLOW_SIGNUP:$ALLOW_SIGNUP"
          --var "ADMIN_EMAILS:$ADMIN_EMAILS"
          --var "OPS_EMAIL:$OPS_EMAIL"
          --var "SENTRY_DSN:$SENTRY_DSN"
      - name: Prueba de humo
        run: curl -fsS "${{ vars.APP_URL }}/health"
