# APK de producción firmado (anexo §4.10: distribución directa desde R2, sin Play Store en el piloto).
name: APK Android
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar en R2 (yvy-tiles/app/yvy.apk)
        type: boolean
        default: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.APP_URL }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EAS_UPDATE_URL: ${{ vars.EAS_UPDATE_URL }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN_APP }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      # Guarda entre corridas las dependencias de Gradle, el wrapper y la caché de compilación (~/.gradle):
      # sin esto cada APK bajaba todo y recompilaba el código nativo desde cero (~16 min)
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install
      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        # Solo arm64: los celulares Android de los últimos años son todos de 64 bits y compilar una sola arquitectura
        # nativa reduce a la mitad el tiempo y el tamaño del APK. --build-cache reusa tareas de la corrida anterior.
        run: ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a
      - name: Firmar con la clave de Yvy
        working-directory: apps/mobile/android/app/build/outputs/apk/release
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > yvy.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 app-release.apk aligned.apk
          # Tolerante a secretos mal cargados: en un keystore PKCS12 (el formato por defecto de keytool) la clave usa la
          # misma contraseña que el keystore, y si el alias no existe se toma el único que haya.
          ALIASES=$(keytool -list -keystore yvy.keystore -storepass:env KS_PASS | sed -n 's/^\([^,]*\), .*PrivateKeyEntry.*/\1/p')
          echo "$ALIASES" | grep -qxF "$KEY_ALIAS" || { echo "El alias de ANDROID_KEY_ALIAS no está en el keystore; uso el primero que hay"; KEY_ALIAS=$(echo "$ALIASES" | head -1); }
          sign() { "$BT/apksigner" sign --ks yvy.keystore --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass "env:$1" --out yvy.apk aligned.apk; }
          if [ -n "$KEY_PASS" ] && sign KEY_PASS; then :; else echo "ANDROID_KEY_PASSWORD no abre la clave; pruebo con la del keystore"; sign KS_PASS; fi
          "$BT/apksigner" verify --print-certs yvy.apk | head -3
          rm yvy.keystore
          ls -la yvy.apk
      - uses: actions/upload-artifact@v7
        with: { name: yvy-apk, path: apps/mobile/android/app/build/outputs/apk/release/yvy.apk }
      - name: Publicar en R2
        if: ${{ inputs.publish }}
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          APK=../mobile/android/app/build/outputs/apk/release/yvy.apk
          npx wrangler r2 object put yvy-tiles/app/yvy.apk --file "$APK" --content-type application/vnd.android.package-archive --remote
          npx wrangler r2 object put "yvy-tiles/app/yvy-${{ github.run_number }}.apk" --file "$APK" --content-type application/vnd.android.package-archive --remote
