# Carga (o completa) la organización demo en producción desde apps/api/seed/demo.sql.
# Manual: Actions → Cargar demo → Run workflow. Solo inserta (INSERT OR IGNORE): no pisa ni borra datos.
name: Cargar demo
on:
  workflow_dispatch:
jobs:
  demo:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configuración de producción
        working-directory: apps/api
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          sed -i "s/\"database_id\": \"[^\"]*\"/\"database_id\": \"$D1_DATABASE_ID\"/" wrangler.jsonc
          grep -q "$D1_DATABASE_ID" wrangler.jsonc
      - name: Solo inserciones
        working-directory: apps/api
        run: "! grep -Eiq '^[[:space:]]*(delete|drop|update|alter)[[:space:]]' seed/demo.sql"
      - name: Cargar demo.sql
        working-directory: apps/api
        run: npx wrangler d1 execute yvy --remote --file=seed/demo.sql
