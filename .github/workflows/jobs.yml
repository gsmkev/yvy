# Jobs satelitales y climáticos (PRD-cloudflare §4.6). Minutos estimados: ~640/mes para 20 estancias.
name: Jobs de datos
on:
  schedule:
    # GitHub puede saltear o demorar horarios con carga: los jobs diarios corren en varios turnos y solo procesan lo que falta
    - cron: "15 13,19 * * *" # s2_ingest (después del paso de Sentinel-2 por Paraguay)
    - cron: "30 10,16,22 * * *" # chirps_daily
    - cron: "40 */3 * * *" # firms_hotspots cada 3 h
    - cron: "0 4 * * 0" # semanal: climatología, mapa base e informe de riesgo (cada 90 días) de estancias nuevas
    - cron: "0 5 1 */3 *" # mapa base de todas y el de todo el país cada 3 meses
    - cron: "0 9 * * 1" # lunes: PDF del parte semanal (R-02); el Worker manda los emails a las 10:00 UTC
    - cron: "30 12 * * 1" # lunes: área quemada (S-20) tras los focos de fuego
    - cron: "0 6 15 1,4,7,10 *" # trimestral: indicador EUDR (S-30) de todas las estancias (Sentinel-2 de la estación seca)
    - cron: "0 7 2 1 *" # anual: límites administrativos (M-16, geoBoundaries)
  workflow_dispatch:
    inputs:
      job:
        description: Job
        type: choice
        options:
          [
            weekly,
            new_farm,
            s2_ingest,
            s2_basemap,
            country_basemap,
            chirps_daily,
            firms_hotspots,
            climatology_build,
            risk_report,
            weekly_report,
            eudr,
            s2_history,
            burned_area,
            cover_change,
            power_daily,
            spi,
            mgmt_zones,
            boundaries,
            custom_layers,
          ]
      farm:
        description: "Id de estancia (obligatorio para new_farm y s2_history; eudr: indicador de deforestación de esa estancia, vacío = todas)"
        required: false
      from:
        description: "cover_change: fecha inicial (AAAA-MM-DD)"
        required: false
      to:
        description: "cover_change: fecha final (AAAA-MM-DD)"
        required: false
concurrency:
  # new_farm por estancia: dos estancias creadas a la vez no se cancelan entre sí en la cola
  group: jobs-${{ github.event.schedule || format('{0}-{1}-{2}', inputs.job, inputs.farm, inputs.to) }}
  cancel-in-progress: false
jobs:
  run:
    # Se saltea (no falla) hasta que estén configurados los secrets y variables de docs/DEPLOY.md
    if: ${{ vars.YVY_API_URL != '' }}
    runs-on: ubuntu-latest
    # s2_history y el mapa del país (solo o en la corrida trimestral) tardan horas, el resto minutos
    timeout-minutes: ${{ (inputs.job == 's2_history' || inputs.job == 'country_basemap' || github.event.schedule == '0 5 1 */3 *') && 300 || 60 }}
    defaults: { run: { working-directory: workers-py } }
    env:
      YVY_API_URL: ${{ vars.YVY_API_URL }}
      YVY_INGEST_SECRET: ${{ secrets.YVY_INGEST_SECRET }}
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - name: Elegir job
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "15 13,19 * * *") echo "cmd=s2_ingest" >> $GITHUB_OUTPUT ;;
            "30 10,16,22 * * *") echo "cmd=chirps_daily" >> $GITHUB_OUTPUT ;;
            "40 */3 * * *") echo "cmd=firms_hotspots" >> $GITHUB_OUTPUT ;;
            "0 4 * * 0") echo "cmd=weekly" >> $GITHUB_OUTPUT ;;
            "0 5 1 */3 *") echo "cmd=s2_basemap" >> $GITHUB_OUTPUT ;;
            "0 9 * * 1") echo "cmd=weekly_report" >> $GITHUB_OUTPUT ;;
            "30 12 * * 1") echo "cmd=burned_area" >> $GITHUB_OUTPUT ;;
            "0 6 15 1,4,7,10 *") echo "cmd=eudr" >> $GITHUB_OUTPUT ;;
            "0 7 2 1 *") echo "cmd=boundaries" >> $GITHUB_OUTPUT ;;
            *) echo "cmd=${{ inputs.job }}" >> $GITHUB_OUTPUT ;;
          esac
      - if: steps.pick.outputs.cmd == 'weekly'
        run: |
          uv run --frozen python -m yvy_workers climatology_build --only-missing
          uv run --frozen python -m yvy_workers s2_basemap --only-missing
          uv run --frozen python -m yvy_workers risk_report --only-missing
          # Historia de vigor de 180 días: solo procesa las pasadas que cada estancia todavía no tiene
          uv run --frozen python -m yvy_workers s2_ingest --backfill
          uv run --frozen python -m yvy_workers power_daily
          uv run --frozen python -m yvy_workers spi
          # GeoTIFF subidos como capas propias que el aviso inmediato no alcanzó a procesar (M-17)
          uv run --frozen python -m yvy_workers custom_layers
      - if: github.event.schedule == '0 5 1 */3 *'
        run: uv run --frozen python -m yvy_workers country_basemap
      - if: steps.pick.outputs.cmd != 'weekly'
        env:
          FARM: ${{ inputs.farm }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: uv run --frozen python -m yvy_workers ${{ steps.pick.outputs.cmd }} ${FARM:+--farm "$FARM"} ${FROM:+--from "$FROM"} ${TO:+--to "$TO"}
