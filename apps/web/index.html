<!doctype html>
<html lang="es-PY">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBFAF5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12170F" media="(prefers-color-scheme: dark)" />
    <script>
      // Tema elegido a mano (U-20): se aplica antes de pintar para evitar el destello
      try {
        var th = localStorage.getItem("yvy.theme");
        if (th === "light" || th === "dark") document.documentElement.dataset.theme = th;
      } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Yvy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
