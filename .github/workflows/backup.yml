# Backup semanal de D1 a R2 (anexo §4.10), restaurado y verificado en el mismo trabajo (P-05).
# D1 Time Travel cubre 7 días; esto guarda historia más larga. Pasos: contar filas de D1 -> exportar -> restaurar la copia
# en una base SQLite temporal y compararla (esquema, tablas clave y conteos) -> subir a R2. La copia se sube aunque la
# verificación falle (mejor una copia dudosa que ninguna), pero el trabajo queda en rojo y GitHub avisa por email.
# Ver docs/DEPLOY.md, "Restaurar un backup".
name: Backup D1
on:
  schedule: [{ cron: "20 6 * * 0" }]
  workflow_dispatch:
jobs:
  backup:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Contar las filas de D1 (solo lectura) y exportar
        id: export
        run: |
          d="$(date -u +%Y-%m-%d)"
          echo "d=$d" >> "$GITHUB_OUTPUT"
          node scripts/backup-counts.mjs "yvy-$d.counts.json"
          npx wrangler d1 export yvy --remote --output "yvy-$d.sql"
          gzip "yvy-$d.sql"
      - name: Restaurar en una base temporal y verificar
        id: verify
        run: |
          d="${{ steps.export.outputs.d }}"
          node scripts/restore-backup.mjs "yvy-$d.sql.gz" --counts "yvy-$d.counts.json" --db "$RUNNER_TEMP/restaurada.sqlite" | tee "$RUNNER_TEMP/resultado.txt"
      - name: Subir la copia y los conteos a R2
        if: ${{ always() && steps.export.outcome == 'success' }}
        run: |
          d="${{ steps.export.outputs.d }}"
          npx wrangler r2 object put "yvy-media/backups/yvy-$d.sql.gz" --file "yvy-$d.sql.gz" --remote
          npx wrangler r2 object put "yvy-media/backups/yvy-$d.counts.json" --file "yvy-$d.counts.json" --remote
      - name: Resumen
        if: always()
        run: |
          {
            echo "### Backup de D1"
            echo '```'
            cat "$RUNNER_TEMP/resultado.txt" 2>/dev/null || echo "No se pudo restaurar la copia"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
